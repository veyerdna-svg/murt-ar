<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <title>МУРТ AR</title>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- MindAR + A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #startScreen {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #000;
    }

    #startButton {
      border: 0;
      border-radius: 16px;
      padding: 18px 28px;

      background: #fff;
      color: #000;

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
      -webkit-appearance: none;
    }

    #status {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 20px;

      z-index: 1100;

      padding: 12px 16px;

      border-radius: 14px;

      background: rgba(0, 0, 0, 0.7);
      color: #fff;

      text-align: center;
      font-size: 14px;

      pointer-events: none;
    }

    a-scene {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <!-- Экран запуска -->
  <div id="startScreen">
    <button id="startButton">
      Запустить камеру
    </button>
  </div>

  <!-- Статус -->
  <div id="status">
    Нажмите «Запустить камеру»
  </div>

  <!-- AR -->
  <a-scene
    id="arScene"

    mindar-image="
      imageTargetSrc: ./targets.mind;
      autoStart: false;
      uiLoading: yes;
      uiScanning: yes;
      filterMinCF: 0.0001;
      filterBeta: 0.001
    "

    color-space="sRGB"

    renderer="
      colorManagement: true;
      physicallyCorrectLights: true
    "

    vr-mode-ui="enabled: false"

    device-orientation-permission-ui="enabled: false"

    embedded
  >

    <a-assets>

      <img
        id="infoCard"
        src="./assets/info-card.png"
      >

    </a-assets>

    <!-- Камера -->
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>


    <!-- ====================== -->
    <!-- TARGET 0 — ЗНАК МУРТ   -->
    <!-- ====================== -->

    <a-entity
      mindar-image-target="targetIndex: 0"
    >

      <a-plane
        src="#infoCard"

        position="0.75 0 0.02"

        width="0.75"
        height="0.95"

        rotation="0 0 0"
      ></a-plane>

    </a-entity>


    <!-- ====================== -->
    <!-- TARGET 1 — CARD TARGET  -->
    <!-- ====================== -->

    <a-entity
      mindar-image-target="targetIndex: 1"
    >

      <a-plane
        src="#infoCard"

        position="0.75 0 0.02"

        width="0.75"
        height="0.95"

        rotation="0 0 0"
      ></a-plane>

    </a-entity>

  </a-scene>


  <script>

    const scene = document.getElementById("arScene");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const status = document.getElementById("status");


    /*
      Показываем реальные события MindAR.
    */

    scene.addEventListener("arReady", function () {

      console.log("MindAR READY");

      startScreen.style.display = "none";

      status.textContent =
        "Наведите камеру на знак МУРТ";
    });


    scene.addEventListener("arError", function (event) {

      console.error(
        "MindAR ERROR:",
        event
      );

      status.textContent =
        "Ошибка запуска AR";
    });


    /*
      Когда сцена полностью загрузилась.
    */

    scene.addEventListener("loaded", function () {

      console.log("A-Frame loaded");

    });


    /*
      Запуск по нажатию.
    */

    startButton.addEventListener("click", async function () {

      startButton.disabled = true;

      startButton.textContent =
        "Запуск...";

      status.textContent =
        "Запрашиваем доступ к камере...";


      try {

        /*
          1.
          Сначала напрямую проверяем,
          может ли Safari открыть камеру.
        */

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "getUserMedia недоступен"
          );

        }


        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: "environment"
            },

            audio: false

          });


        console.log(
          "Камера Safari работает",
          stream
        );


        /*
          Нам больше не нужен этот
          тестовый поток.

          MindAR сам откроет камеру.
        */

        stream
          .getTracks()
          .forEach(function (track) {

            track.stop();

          });


        status.textContent =
          "Камера разрешена. Запускаем AR...";


        /*
          Даём A-Frame закончить загрузку.
        */

        await new Promise(function (resolve) {

          if (scene.hasLoaded) {

            resolve();

          } else {

            scene.addEventListener(
              "loaded",
              resolve,
              { once: true }
            );

          }

        });


        /*
          Получаем систему MindAR.
        */

        const arSystem =
          scene.systems["mindar-image-system"];


        if (!arSystem) {

          throw new Error(
            "MindAR system не найден"
          );

        }


        console.log(
          "MindAR system найден"
        );


        /*
          Запускаем AR.
        */

        await arSystem.start();


        console.log(
          "MindAR запущен"
        );

      } catch (error) {

        console.error(
          "ПОЛНАЯ ОШИБКА:",
          error
        );


        let errorText =
          "Неизвестная ошибка";


        if (error) {

          if (error.name) {
            errorText = error.name;
          }

          if (error.message) {

            errorText +=
              " — " +
              error.message;

          }

        }


        status.textContent =
          "Ошибка: " +
          errorText;


        startButton.disabled =
          false;

        startButton.textContent =
          "Попробовать снова";

      }

    });

  </script>

</body>
</html>
