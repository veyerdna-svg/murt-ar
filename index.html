<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Тест камеры МУРТ</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #button {
      position: fixed;
      z-index: 10;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      padding: 18px 26px;
      border: none;
      border-radius: 14px;

      background: white;
      color: black;

      font-size: 18px;
      font-weight: 600;
    }

    #status {
      position: fixed;
      z-index: 10;
      left: 15px;
      right: 15px;
      bottom: 20px;

      padding: 12px;
      border-radius: 12px;

      background: rgba(0,0,0,.75);
      color: white;

      text-align: center;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <video id="video" autoplay playsinline muted></video>

  <button id="button">
    Запустить камеру
  </button>

  <div id="status">
    Нажмите кнопку
  </div>

  <script>
    const video = document.getElementById("video");
    const button = document.getElementById("button");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {

      button.style.display = "none";
      status.textContent = "Запрашиваем камеру...";

      try {

        if (!window.isSecureContext) {
          throw new Error("Страница не работает через HTTPS");
        }

        if (!navigator.mediaDevices) {
          throw new Error("navigator.mediaDevices недоступен");
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" }
          },
          audio: false
        });

        video.srcObject = stream;

        status.textContent = "КАМЕРА РАБОТАЕТ";

      } catch (error) {

        console.error(error);

        status.textContent =
          "ОШИБКА: " +
          error.name +
          (error.message ? " — " + error.message : "");

        button.style.display = "block";
        button.textContent = "Попробовать снова";
      }
    });
  </script>

</body>
</html>
