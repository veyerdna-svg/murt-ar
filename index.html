<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>МУРТ AR</title>


<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


<style>

body {
  margin:0;
}

#start {
  position:fixed;
  z-index:999;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

  padding:18px 30px;
  font-size:20px;
  border-radius:15px;
}

#status {

 position:fixed;
 bottom:20px;
 left:20px;
 right:20px;

 z-index:999;

 background:black;
 color:white;

 padding:15px;

 text-align:center;

 font-family:sans-serif;

}

</style>


</head>


<body>


<button id="start">
Запустить камеру
</button>


<div id="status">
Загрузка...
</div>



<a-scene

mindar-image="
imageTargetSrc: ./targets.mind;
autoStart: false;
"

embedded

color-space="sRGB"

vr-mode-ui="enabled:false"

device-orientation-permission-ui="enabled:false"

>


<a-assets>

<img id="card" src="./assets/info-card.png">

</a-assets>


<a-camera
position="0 0 0"
look-controls="enabled:false">
</a-camera>



<a-entity
mindar-image-target="targetIndex:0">


<a-plane

src="#card"

position="0 0 0"

width="1"

height="1"

>

</a-plane>


</a-entity>


</a-scene>




<script>


const scene = document.querySelector("a-scene");

const button = document.querySelector("#start");

const status = document.querySelector("#status");


let arSystem;



scene.addEventListener("loaded",()=>{


arSystem =
scene.systems["mindar-image-system"];


if(arSystem){

status.innerHTML="MindAR готов";

}else{

status.innerHTML="MindAR НЕ найден";

}


});



button.onclick = async ()=>{


try{


status.innerHTML="Запускаем AR";


await arSystem.start();


button.style.display="none";


status.innerHTML=
"Наведите камеру на знак МУРТ";


}

catch(e){


status.innerHTML=
"Ошибка: "+e.message;


console.log(e);


}


};


</script>


</body>

</html>
